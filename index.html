<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStore Pipeline</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --blue: #58a6ff;
      --purple: #bc8cff;
      --orange: #ffa657;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      padding: 24px;
      min-height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 20px; font-weight: 600; }
    .meta { color: var(--muted); font-size: 13px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .refresh-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    .refresh-btn:hover { background: #21262d; }
    .token-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .token-btn:hover { background: #21262d; }
    .token-btn.has-token { color: var(--green); border-color: rgba(63,185,80,0.4); }
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 860px) { .agents-grid { grid-template-columns: 1fr; } }
    .agent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      min-height: 160px;
    }
    .agent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .agent-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 12px;
    }
    .status-running  { background: rgba(63,185,80,0.15);   color: var(--green); }
    .status-queued   { background: rgba(210,153,34,0.15);  color: var(--yellow); }
    .status-idle     { background: rgba(139,148,158,0.12); color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .dot-pulse { animation: pulse 1.8s ease-in-out infinite; }
    .issue-list { display: flex; flex-direction: column; gap: 8px; }
    .issue-item {
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .issue-num { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
    .issue-title-text { font-size: 13px; line-height: 1.45; }
    .issue-footer { font-size: 11px; color: var(--muted); margin-top: 5px; display: flex; gap: 10px; }
    .no-work { color: var(--muted); font-size: 13px; font-style: italic; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .queue-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .queue-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .queue-rows { display: flex; flex-direction: column; gap: 0; }
    .queue-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .queue-row:last-child { border-bottom: none; }
    .q-label {
      font-size: 12px;
      font-weight: 500;
      padding: 2px 10px;
      border-radius: 12px;
      white-space: nowrap;
      min-width: 105px;
      text-align: center;
    }
    .lbl-in-progress { background: rgba(88,166,255,0.15);  color: var(--blue); }
    .lbl-code-review  { background: rgba(188,140,255,0.15); color: var(--purple); }
    .lbl-in-test      { background: rgba(255,166,87,0.15);  color: var(--orange); }
    .lbl-ready        { background: rgba(63,185,80,0.15);   color: var(--green); }
    .lbl-cap-wait     { background: rgba(248,81,73,0.15);   color: var(--red); }
    .lbl-other        { background: rgba(139,148,158,0.12); color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 12px;
      padding: 2px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.12s, color 0.12s;
    }
    .chip:hover { border-color: var(--blue); color: var(--blue); text-decoration: none; }
    .empty-dash { color: var(--muted); font-size: 13px; }
    .error-txt { color: var(--red); font-size: 13px; }
    .loading-txt { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>MyStore Pipeline</h1>
    <div class="meta" style="margin-top:4px" id="last-updated">Loading…</div>
  </div>
  <div class="header-right">
    <span class="meta" id="countdown"></span>
    <button class="token-btn" id="token-btn" onclick="setToken()">Set Token</button>
    <button class="refresh-btn" onclick="doRefresh()">↻ Refresh</button>
  </div>
</header>

<div class="agents-grid">
  <div class="agent-card">
    <div class="agent-header">
      <span class="agent-title">Developer Agent</span>
      <span class="status-badge status-idle" id="dev-badge"><span class="dot"></span>&nbsp;Idle</span>
    </div>
    <div id="dev-body" class="loading-txt">Loading…</div>
  </div>
  <div class="agent-card">
    <div class="agent-header">
      <span class="agent-title">Code Review Agent</span>
      <span class="status-badge status-idle" id="rev-badge"><span class="dot"></span>&nbsp;Idle</span>
    </div>
    <div id="rev-body" class="loading-txt">Loading…</div>
  </div>
  <div class="agent-card">
    <div class="agent-header">
      <span class="agent-title">Test Agent</span>
      <span class="status-badge status-idle" id="tst-badge"><span class="dot"></span>&nbsp;Idle</span>
    </div>
    <div id="tst-body" class="loading-txt">Loading…</div>
  </div>
</div>

<div class="queue-card">
  <div class="queue-title">Issue Queue</div>
  <div class="queue-rows" id="queue-rows">
    <div class="loading-txt">Loading…</div>
  </div>
</div>

<script>
  const ORCH  = 'retrostoremanager/orchestrator-mystore';
  const FN    = 'retrostoremanager/fn-mystore';
  const WEB   = 'retrostoremanager/web-mystore';
  const GH    = 'https://api.github.com';
  const REFRESH_SEC = 180;

  // AES-256-GCM + PBKDF2 token encryption (Web Crypto API)
  const _te = new TextEncoder(), _td = new TextDecoder();
  const _b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const _b64d = s   => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function _deriveKey(passphrase, salt) {
    const km = await crypto.subtle.importKey('raw', _te.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  }

  async function _storeEncrypted(token, passphrase) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const key  = await _deriveKey(passphrase, salt);
    const ct   = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, _te.encode(token));
    localStorage.setItem('gh_token_enc', JSON.stringify({ s: _b64e(salt), i: _b64e(iv), c: _b64e(ct) }));
    localStorage.removeItem('gh_token');
    sessionStorage.setItem('gh_token_cache', token);
  }

  async function _unlockStored(passphrase) {
    const raw = localStorage.getItem('gh_token_enc');
    if (!raw) throw new Error('No encrypted token');
    const { s, i, c } = JSON.parse(raw);
    const key   = await _deriveKey(passphrase, _b64d(s));
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: _b64d(i) }, key, _b64d(c));
    const token = _td.decode(plain);
    sessionStorage.setItem('gh_token_cache', token);
    return token;
  }

  function _tokenState() {
    if (sessionStorage.getItem('gh_token_cache')) return 'active';
    if (localStorage.getItem('gh_token_enc'))     return 'locked';
    if (localStorage.getItem('gh_token'))         return 'plain';
    return 'none';
  }

  function ghToken() {
    return sessionStorage.getItem('gh_token_cache') || localStorage.getItem('gh_token') || '';
  }

  function updateTokenBtn() {
    const btn = document.getElementById('token-btn');
    const s = _tokenState();
    btn.textContent = { active: 'Token ✓', locked: '🔒 Unlock', plain: '⚠ Encrypt', none: 'Set Token' }[s];
    btn.classList.toggle('has-token', s === 'active');
  }

  async function setToken() {
    const s = _tokenState();

    if (s === 'locked') {
      const pp = prompt('Passphrase to unlock:');
      if (pp === null) return;
      try { await _unlockStored(pp); updateTokenBtn(); doRefresh(); }
      catch { alert('Wrong passphrase.'); }
      return;
    }

    const msg = s === 'active' ? 'Enter new GitHub token (blank to remove):' :
                s === 'plain'  ? 'Re-enter token to encrypt it:'            :
                                 'Enter GitHub token (ghp_…):';
    const token = prompt(msg);
    if (token === null) return;

    if (!token.trim()) {
      ['gh_token', 'gh_token_enc'].forEach(k => localStorage.removeItem(k));
      sessionStorage.removeItem('gh_token_cache');
      updateTokenBtn();
      return;
    }

    const pp  = prompt('Set an encryption passphrase:');
    if (!pp) return;
    const pp2 = prompt('Confirm passphrase:');
    if (pp !== pp2) { alert('Passphrases do not match.'); return; }

    await _storeEncrypted(token.trim(), pp);
    updateTokenBtn();
    doRefresh();
  }

  async function initToken() {
    updateTokenBtn();
    if (_tokenState() !== 'locked') return;
    const pp = prompt('Enter passphrase to unlock dashboard:');
    if (!pp) return;
    try { await _unlockStored(pp); updateTokenBtn(); doRefresh(); }
    catch { /* wrong passphrase — user can click Unlock to retry */ }
  }

  let timer, cdTimer, cd = REFRESH_SEC;

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function ago(d) {
    const s = Math.floor((Date.now() - new Date(d)) / 1000);
    if (s < 60)   return s + 's ago';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400)return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  async function get(url) {
    const headers = { Accept: 'application/vnd.github+json' };
    const tok = ghToken();
    if (tok) headers['Authorization'] = 'Bearer ' + tok;
    const r = await fetch(url, { headers });
    if (r.status === 403 || r.status === 429) {
      const reset = r.headers.get('X-RateLimit-Reset');
      const msg = reset ? ` (resets ${ago(new Date(reset * 1000))})` : '';
      throw new Error('GitHub rate limit hit' + msg + ' — add a token: localStorage.setItem(\'gh_token\', \'ghp_...\')');
    }
    if (!r.ok) throw new Error('GitHub API ' + r.status + ': ' + url.replace(GH,''));
    return r.json();
  }

  function setBadge(id, status) {
    const el = document.getElementById(id);
    const cls = { running:'status-running', queued:'status-queued', idle:'status-idle' }[status] || 'status-idle';
    const label = { running:'Running', queued:'Queued', idle:'Idle' }[status] || 'Idle';
    const dotClass = status === 'running' ? 'dot dot-pulse' : 'dot';
    el.className = 'status-badge ' + cls;
    el.innerHTML = `<span class="${dotClass}"></span>&nbsp;${label}`;
  }

  function renderAgentBody(el, issues, runUrl) {
    if (!issues.length) {
      el.innerHTML = '<span class="no-work">No active work</span>';
      return;
    }
    el.innerHTML = '<div class="issue-list">' + issues.map(i => `
      <div class="issue-item">
        <div class="issue-num"><a href="${i.html_url}" target="_blank">#${i.number}</a></div>
        <div class="issue-title-text">${esc(i.title)}</div>
        <div class="issue-footer">
          <span>opened ${ago(i.created_at)}</span>
          ${runUrl ? `<a href="${runUrl}" target="_blank">view run ↗</a>` : ''}
        </div>
      </div>`).join('') + '</div>';
  }

  async function doRefresh() {
    clearTimeout(timer);
    clearInterval(cdTimer);
    cd = REFRESH_SEC;
    document.getElementById('last-updated').textContent = 'Refreshing…';
    document.getElementById('countdown').textContent = '';

    try {
      // 3 calls total (vs 7) — fetch all runs per repo and filter client-side by workflow path.
      const [issues, fnRuns, webRuns] = await Promise.all([
        get(`${GH}/repos/${ORCH}/issues?state=open&per_page=100`),
        get(`${GH}/repos/${FN}/actions/runs?per_page=20`),
        get(`${GH}/repos/${WEB}/actions/runs?per_page=20`),
      ]);

      const allRuns = [...(fnRuns.workflow_runs||[]), ...(webRuns.workflow_runs||[])];
      const runsFor = path => ({ workflow_runs: allRuns.filter(r => r.path === path || r.path?.endsWith('/' + path)) });
      const claudeRuns = runsFor('claude-code.yml');
      const reviewRuns = runsFor('code-review.yml');
      const testRuns   = runsFor('test-agent.yml');

      // Group issues by first matching pipeline label
      const buckets = { 'in-progress':[], 'code-review':[], 'in-test':[], 'cap-wait':[], 'ready':[], 'other':[] };
      const ORDER = ['in-progress','code-review','in-test','cap-wait','ready'];
      issues.forEach(issue => {
        const names = issue.labels.map(l => l.name);
        const match = ORDER.find(lbl => names.includes(lbl));
        (buckets[match || 'other'] ||= []).push(issue);
      });

      // Active workflow runs
      const isActive = r => r.status === 'in_progress' || r.status === 'queued';
      const activeClaudeRun = claudeRuns.workflow_runs?.find(isActive) ?? null;
      const activeRevRun    = reviewRuns.workflow_runs?.find(isActive) ?? null;
      const activeTestRun   = testRuns.workflow_runs?.find(isActive)   ?? null;

      // Dev agent uses claude-code.yml — but so does the review agent.
      // Only treat a claude-code.yml run as a dev run when there's an in-progress issue.
      // When there's a code-review issue instead, the run belongs to the review agent.
      const hasInProgress  = buckets['in-progress'].length > 0;
      const hasCodeReview  = buckets['code-review'].length  > 0;
      const activeDevRun   = (activeClaudeRun && hasInProgress)  ? activeClaudeRun : null;
      const activeRevAgent = (activeClaudeRun && hasCodeReview)  ? activeClaudeRun : activeRevRun;

      const devStatus = activeDevRun
        ? activeDevRun.status
        : (hasInProgress ? 'queued' : 'idle');
      const revStatus = activeRevAgent
        ? activeRevAgent.status
        : (hasCodeReview ? 'queued' : 'idle');
      const tstStatus = activeTestRun
        ? activeTestRun.status
        : (buckets['in-test'].length ? 'queued' : 'idle');

      setBadge('dev-badge', devStatus === 'in_progress' ? 'running' : devStatus);
      setBadge('rev-badge', revStatus === 'in_progress' ? 'running' : revStatus);
      setBadge('tst-badge', tstStatus === 'in_progress' ? 'running' : tstStatus);

      renderAgentBody(document.getElementById('dev-body'), buckets['in-progress'], activeDevRun?.html_url);
      renderAgentBody(document.getElementById('rev-body'), buckets['code-review'],  activeRevAgent?.html_url);
      renderAgentBody(document.getElementById('tst-body'), buckets['in-test'],      activeTestRun?.html_url);

      // Render queue
      const queueDef = [
        { key:'in-progress', cls:'lbl-in-progress' },
        { key:'code-review',  cls:'lbl-code-review'  },
        { key:'in-test',      cls:'lbl-in-test'      },
        { key:'ready',        cls:'lbl-ready'         },
        { key:'cap-wait',     cls:'lbl-cap-wait'      },
        { key:'other',        cls:'lbl-other',  label:'backlog' },
      ];
      document.getElementById('queue-rows').innerHTML = queueDef.map(({ key, cls, label }) => {
        const items = buckets[key] ?? [];
        const chips = items.length
          ? items.map(i => `<a href="${i.html_url}" target="_blank" class="chip" title="${esc(i.title)}">#${i.number}</a>`).join('')
          : '<span class="empty-dash">—</span>';
        return `<div class="queue-row">
          <span class="q-label ${cls}">${label || key}</span>
          <div class="chips">${chips}</div>
        </div>`;
      }).join('');

      document.getElementById('last-updated').textContent =
        'Last updated ' + new Date().toLocaleTimeString();

    } catch (err) {
      document.getElementById('last-updated').innerHTML =
        `<span class="error-txt">Error: ${esc(err.message)} — check GitHub API rate limit or repo visibility</span>`;
    }

    // Schedule next refresh + countdown
    timer = setTimeout(doRefresh, REFRESH_SEC * 1000);
    cdTimer = setInterval(() => {
      cd--;
      if (cd <= 0) { clearInterval(cdTimer); return; }
      const m = Math.floor(cd / 60), s = cd % 60;
      document.getElementById('countdown').textContent =
        'refreshing in ' + (m ? m + 'm ' : '') + s + 's';
    }, 1000);
  }

  doRefresh();
  initToken();
</script>
</body>
</html>
