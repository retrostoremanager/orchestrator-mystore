name: Generate Backlog

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt for Claude'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@beta
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: ${{ github.event.inputs.prompt }}
          mode: agent
          model: ${{ vars.BACKLOG_MODEL || 'claude-opus-4-7' }}
          allowed_tools: Bash
          timeout_minutes: 15
          max_turns: 20

      # A spending-cap hit is transient (resets daily) and not actionable — don't
      # fail the run or email on it. Any other agent failure still fails the run.
      - name: Tolerate spending cap
        if: steps.claude.outcome == 'failure'
        run: |
          OUT=$(cat "${{ steps.claude.outputs.execution_file }}" 2>/dev/null || echo "")
          if echo "$OUT" | grep -q "Spending cap reached"; then
            echo "Spending cap reached — skipping backlog generation this run; it will succeed after the cap resets. Not failing the run."
            exit 0
          fi
          echo "Backlog agent failed for a non-cap reason — failing the run." >&2
          exit 1
