name: "Orchestrator"
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
jobs:
  dispatch-tasks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Process ready tasks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          ORCHESTRATOR_REPO: ${{ github.repository }}
        run: bash scripts/dispatch-tasks.sh
